<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Følg kampen · Trenerbrettet</title><meta name="referrer" content="no-referrer"><link rel="manifest" id="manifestLink" href="./live.webmanifest"><script>(function(){var t=decodeURIComponent(location.hash.slice(1))||new URLSearchParams(location.search).get('t')||'';if(/^[a-f0-9]{64}$/.test(t))document.getElementById('manifestLink').href='./.netlify/functions/live-manifest?t='+t;})();</script><meta name="theme-color" content="#0d1924"><link rel="apple-touch-icon" href="./icon-180.png"><style>body{background:#0c1823;color:#f2f7fa;font:16px system-ui;margin:0;padding:18px}main{max-width:520px;margin:auto}.card{background:#1d303f;border:1px solid #3f5969;border-radius:18px;padding:20px;margin:16px 0}.score{font-size:48px;font-weight:800;text-align:center;color:#d3f47c}.teams{display:flex;justify-content:space-between;gap:16px;text-align:center}.teams>*{flex:1}h1{text-align:center}li{padding:14px 0;border-bottom:1px solid #435563;list-style:none}ul{padding:0}.muted{color:#b8c9d2;font-size:14px}.status{text-align:center}</style></head><body><main><h1>⚽ Trenerbrettet</h1><p class="status" id="status">Henter kampen …</p><section class="card"><div class="teams"><strong id="home">Vårt lag</strong><strong id="away">Motstander</strong></div><div class="score" id="score">–</div><p class="status muted" id="clock"></p></section><section class="card" id="pushCard"><h2>🔔 Kampvarsler</h2><p class="muted" id="pushHelp">Få beskjed når det scores. På iPhone: legg siden til på hjemskjermen og åpne den derfra før du aktiverer varsler.</p><button id="pushEnable" type="button" style="padding:12px;border-radius:10px;background:#d3f47c;color:#17212c;font-weight:bold;border:0">Aktiver kampvarsler</button><button id="pushDisable" type="button" style="padding:12px;border-radius:10px;margin-left:6px">Slå av</button><p class="muted" id="pushStatus" role="status"></p></section><section class="card"><h2>Mål og hendelser</h2><ul id="events"></ul></section><p class="muted">Oppdateres automatisk når treneren er på nett. Kampklokken er sist registrerte tidspunkt.</p></main><script src="./supabase-config.js"></script><script>
const token=decodeURIComponent(location.hash.slice(1))||new URLSearchParams(location.search).get('t')||'';const cfg=window.TRENERBRETTET_SUPABASE||{};const $=id=>document.getElementById(id);let latest='';
function fmt(ms){let s=Math.floor((ms||0)/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
async function refresh(){try{if(!token)throw Error('Mangler delingslenke');const res=await fetch(cfg.url+'/rest/v1/rpc/tb_live_view',{method:'POST',headers:{'Content-Type':'application/json','apikey':cfg.publishableKey},body:JSON.stringify({p_token:token}),cache:'no-store'});if(!res.ok)throw Error('Kampen er ikke tilgjengelig eller delingen er avsluttet.');const data=await res.json();if(!data)throw Error('Kampen er ikke tilgjengelig.');const stamp=JSON.stringify(data);if(stamp===latest)return;latest=stamp;$('home').textContent=data.home||'Vårt lag';$('away').textContent=data.away||'Motstander';$('score').textContent=(data.homeScore||0)+'–'+(data.awayScore||0);$('clock').textContent=(data.period||1)+'. omgang · '+fmt(data.elapsedMs)+' · '+(data.status==='finished'?'Avsluttet':data.status==='paused'?'Pause':data.status==='ready'?'Ikke startet':'Pågår');$('status').textContent=data.status==='finished'?'Kampen er avsluttet':data.status==='ready'?'Kampen har ikke startet':'● Følg kampen live';const list=$('events');list.replaceChildren();for(const e of [...(data.events||[])].reverse()){const li=document.createElement('li');const label=e.side==='away'?(data.away||'Motstander')+' scorer':(e.scorerName||'Mål til '+(data.home||'vårt lag'));li.textContent=(e.period||1)+'. omg · '+fmt(e.elapsedMs)+' · '+label+(e.assistName?' · Assist: '+e.assistName:'');list.append(li);}if(!list.children.length){const li=document.createElement('li');li.textContent='Ingen mål registrert ennå';list.append(li);}}catch(e){$('status').textContent=e.message;}}
const pushStatus=msg=>$('pushStatus').textContent=msg;
const vapidKeyUrl='./.netlify/functions/push-public-key';
function urlBase64ToUint8Array(base64){const pad='='.repeat((4-base64.length%4)%4);const str=atob((base64+pad).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(str,c=>c.charCodeAt(0));}
async function pushSetup(){
 if(!('serviceWorker' in navigator)||!('PushManager' in window)){pushStatus('Denne nettleseren stoetter ikke pushvarsler.');return;}
 if(!window.isSecureContext){pushStatus('Pushvarsler krever HTTPS.');return;}
 if(!('standalone' in navigator && navigator.standalone) && !matchMedia('(display-mode: standalone)').matches && /iPhone|iPad|iPod/.test(navigator.userAgent)){pushStatus('På iPhone: velg Del → Legg til på Hjem-skjerm, og åpne ikonet «Følg kampen» derfra.');return;}
 try{
   const permission=await Notification.requestPermission();if(permission!=='granted'){pushStatus('Varsler ble ikke tillatt.');return;}
   const reg=await navigator.serviceWorker.register('./service-worker.js');await navigator.serviceWorker.ready;
   const keyRes=await fetch(vapidKeyUrl);if(!keyRes.ok)throw Error('Push-tjenesten er ikke konfigurert på Netlify.');
   const {publicKey}=await keyRes.json();if(!publicKey)throw Error('VAPID-noekkel mangler.');
   let sub=await reg.pushManager.getSubscription();if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(publicKey)});
   const res=await fetch('./.netlify/functions/push-subscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,subscription:sub.toJSON()})});
   if(!res.ok)throw Error((await res.json().catch(()=>({}))).error||'Kunne ikke registrere abonnement.');
   pushStatus('Kampvarsler er aktivert på denne telefonen.');
 }catch(e){pushStatus('Kunne ikke aktivere varsler: '+e.message);}
}
$('pushEnable').onclick=pushSetup;
$('pushDisable').onclick=async()=>{try{const reg=await navigator.serviceWorker.ready;const sub=await reg.pushManager.getSubscription();if(sub){await fetch('./.netlify/functions/push-unsubscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,endpoint:sub.endpoint})});await sub.unsubscribe();}pushStatus('Kampvarsler er slått av på denne telefonen.');}catch(e){pushStatus(e.message);}};
refresh();setInterval(refresh,5000);
</script></body></html>
